[package]
name = "soniox"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Rust client for the Soniox speech-to-text and text-to-speech APIs"
repository = "https://github.com/janost/soniox-rs"
license = "MIT"
readme = "README.md"
keywords = ["soniox", "speech-to-text", "text-to-speech", "transcription", "websocket"]
categories = ["api-bindings", "multimedia::audio", "asynchronous"]
# Not on crates.io; depend on it by git.
publish = false

[dependencies]
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
futures-util = { version = "0.3", features = ["sink"] }
# default-features = false keeps native-tls out. `rustls-no-provider` rather
# than `rustls` because the latter selects aws-lc-rs; this crate installs the
# ring provider itself (see `realtime::ensure_crypto_provider`).
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "multipart",
    "stream",
    "query",
] }
# tokio-tungstenite pulls in rustls with no crypto backend selected, and
# rustls 0.23 panics on first use without one. "tls12" is on because dropping
# to TLS 1.3 only breaks against TLS-inspecting proxies.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
url = "2"

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
